# NexusBlog MySQL 数据库配置
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nexusblog}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# JPA 和 Hibernate 配置
jpa:
  hibernate:
    ddl-auto: update
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  show-sql: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true

# SQL 初始化配置
sql:
  init:
    mode: always
    continue-on-error: true

# 服务器配置
server:
  port: 8080

# 应用配置
app:
  jwt:
    secret: NexusBlogSecretKey2024ThisIsALongSecretKeyForSecurityPurposesAtLeast256Bits
    expiration: 86400000
    admin-secret: AdminSecretKey2024ForAdminAccessControlAtLeast256Bits

# API 文档配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志配置
logging:
  level:
    com.nexusblog: debug
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql: info
