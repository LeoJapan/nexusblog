# Server Configuration
server:
  port: 8080

# MySQL Database Configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nexusblog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: true

# Application Configuration
app:
  jwt:
    secret: NexusBlogSecretKey2024ThisIsALongSecretKeyForSecurityPurposesAtLeast256Bits
    expiration: 86400000  # 24 hours in milliseconds
    admin-secret: AdminSecretKey2024ForAdminAccessControlAtLeast256Bits

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
