# Server Configuration
server:
  port: 8080

# H2 Database Configuration (in-memory, for easy startup without MySQL)
spring:
  datasource:
    url: jdbc:h2:mem:nexusblog;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Application Configuration
app:
  jwt:
    secret: NexusBlogSecretKey2024ThisIsALongSecretKeyForSecurityPurposesAtLeast256Bits
    expiration: 86400000
    admin-secret: AdminSecretKey2024ForAdminAccessControlAtLeast256Bits
  # Use H2 profile
  database:
    type: h2

# SQL Init (for H2)
sql:
  init:
    mode: always
    continue-on-error: true
